<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCast | Live Weather Forecast</title>
  <link href="styles.css" rel="stylesheet" />
</head>
<body>

  <div class="container" id="weatherContainer">

    <div class="weather_container">

      <p class="brand">SkyCast</p>

      <div class="icon" id="weatherIcon">⛅</div>

      <div class="temp">
        <p>--</p>
      </div>

      <div class="time_location">
        <p class="location">Loading...</p>
        <p class="date_time">--</p>
      </div>

      <div class="condition">
        <p>--</p>
      </div>

    </div>

    <nav>
      <form>
        <input type="text" placeholder="Search for a location" class="search_area" />
        <button type="submit">Search</button>
      </form>
    </nav>

  </div>

<script src="script.js"></script>
</body>
</html>
